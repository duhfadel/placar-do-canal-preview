<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Tudo do canal num lugar só.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MagrãoTV">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MagrãoTV — Placar do canal</title>
  <link rel="manifest" href="manifest.json">

  <!--
    A link pasted into Discord or into chat arrives as a bare line without
    these, which is most of the difference between a link somebody clicks and
    one they scroll past.

    They are static: the card names the channel, not the prize of the moment.
    Filling in the running raffle would mean rendering this page on the server
    for crawlers, and none of them run the app. If it ever matters, that is the
    shape of the fix — not a cleverer tag.

    og:url and the absolute og:image are stamped at build time by
    tool/stamp_meta.py, from the address in .env — a crawler follows og:url and
    refuses a relative og:image, and neither belongs typed into a file where it
    goes stale the first time the site moves.
  -->
  <meta property="og:url" content="https://magraotv.net.br/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Placar do canal">
  <meta property="og:title" content="MagrãoTV — Placar do canal">
  <meta property="og:description" content="Tudo do canal num lugar só.">
  <meta property="og:image" content="https://magraotv.net.br/share.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="MagrãoTV — Placar do canal">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:locale" content="pt_BR">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="MagrãoTV — Placar do canal">
  <meta name="twitter:description" content="Tudo do canal num lugar só.">
  <meta name="twitter:image" content="https://magraotv.net.br/share.jpg">

  <meta name="theme-color" content="#14101C">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
