<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/placar-do-canal-preview/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Sorteios do canal do magrão, com os pontos de loyalty que você já tem.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="magrao">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Placar do canal — magrão</title>
  <link rel="manifest" href="manifest.json">

  <!--
    A link pasted into Discord or into chat arrives as a bare line without
    these, which is most of the difference between a link somebody clicks and
    one they scroll past.

    They are static: the card names the channel, not the prize of the moment.
    Filling in the running raffle would mean rendering this page on the server
    for crawlers, and none of them run the app. If it ever matters, that is the
    shape of the fix — not a cleverer tag.

    og:url is deliberately absent until there is a real domain. A wrong one is
    worse than none: crawlers follow it.
  -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Placar do canal">
  <meta property="og:title" content="Placar do canal — magrão">
  <meta property="og:description" content="Sorteios do canal, com os pontos que você já tem.">
  <meta property="og:image" content="https://duhfadel.github.io/placar-do-canal-preview/share.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Placar do canal do magrão">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:locale" content="pt_BR">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Placar do canal — magrão">
  <meta name="twitter:description" content="Sorteios do canal, com os pontos que você já tem.">
  <meta name="twitter:image" content="https://duhfadel.github.io/placar-do-canal-preview/share.jpg">

  <meta name="theme-color" content="#14101C">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.

    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
